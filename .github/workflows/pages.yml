name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Audit deployable artefact
        run: npm run lint:bundle

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live scanner entry point
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ok=0
          for attempt in $(seq 1 36); do
            verify="${EXPECTED_SHA}-${attempt}"
            if curl -fsS "${PAGE_URL}qise.html?verify=${verify}" -o /tmp/qise.html \
              && curl -fsS "${PAGE_URL}build-info.json?verify=${verify}" -o /tmp/build-info.json \
              && EXPECTED_SHA="$EXPECTED_SHA" node -e "const fs=require('node:fs');const b=JSON.parse(fs.readFileSync('/tmp/build-info.json','utf8'));if(b.commitSha!==process.env.EXPECTED_SHA)process.exit(1)" \
              && grep -q '<title>Qi Se tracker</title>' /tmp/qise.html; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::live Qi Se page did not become ready"; exit 1; }
          curl -fsS "${PAGE_URL}manifest.webmanifest?verify=${EXPECTED_SHA}" -o /tmp/manifest.webmanifest
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('/tmp/manifest.webmanifest','utf8'));if(m.start_url!=='./qise.html')process.exit(1)"
          curl -fsS "${PAGE_URL}qise/consent.js?verify=${EXPECTED_SHA}" | grep -q 'qise-consent-v3'
          curl -fsS "${PAGE_URL}qise/integrated.js?verify=${EXPECTED_SHA}" -o /dev/null
          curl -fsS "${PAGE_URL}region-extractor.js?verify=${EXPECTED_SHA}" -o /dev/null
          echo "Live scanner: ${PAGE_URL}qise.html @ ${EXPECTED_SHA}"
