name: CI

on:
  push:
  pull_request:

env:
  # Regression gate on test deletion. Raise it when the suite grows; never
  # lower it to make a red build green.
  MIN_TESTS: 159

jobs:
  test:
    # Windows is not optional here. Three defects that shipped green were
    # invisible on Linux: the quoted test glob, the .pathname ROOT, and the
    # PowerShell encoding round-trip that double-encoded two source files.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # A build that produces nothing must not pass. Mirrors the floor check in
      # the test runner: exit code 0 is not evidence that work happened.
      - name: Assert the build produced an artefact
        shell: bash
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/build-info.json || { echo "::error::build-info.json missing"; exit 1; }
          count=$(find dist -type f | wc -l)
          echo "dist/ contains $count files"
          [ "$count" -ge 20 ] || { echo "::error::dist/ has only $count files"; exit 1; }

      - name: Test
        run: npm test

      # Guards against the failure mode where npm test exits 0 having run
      # nothing, AND against tests being deleted to make a red build green.
      # Double-quoted glob patterns throughout (CLAUDE.md item 7): npm runs
      # scripts through cmd.exe on Windows, which does not strip single quotes.
      - name: Assert tests were discovered and none were deleted
        shell: bash
        run: |
          out="$(npm test 2>&1)"
          echo "$out"
          echo "$out" | grep -qE "Running [1-9][0-9]* test file" \
            || { echo "::error::test run reported no discovered test files"; exit 1; }
          # The summary prefix is "#" under the TAP reporter and "ℹ" under spec,
          # and Node picks between them BY VERSION: 20 and 22 emit TAP here, 24
          # emits spec. "^." matched the one-byte "#" everywhere, but "ℹ" is
          # three bytes (U+2139) and grep's "." matches a single BYTE in the
          # C/POSIX locale that Git Bash uses. So the pattern silently held on
          # every leg except windows + node 24 — where grep matched nothing,
          # and because GitHub runs bash with -eo pipefail the step aborted on
          # the assignment itself, with 208/208 tests passing and no error
          # message at all. Match a whole non-space token instead, which is
          # locale-independent and reporter-independent.
          total="$(echo "$out" | grep -oE "^[^ ]* tests [0-9]+" | grep -oE "[0-9]+" | tail -1)"
          fail="$(echo "$out" | grep -oE "^[^ ]* fail [0-9]+" | grep -oE "[0-9]+" | tail -1)"
          echo "discovered $total tests, $fail failing"
          [ -n "$total" ] || { echo "::error::could not read the test count"; exit 1; }
          [ "$fail" = "0" ] || { echo "::error::$fail test(s) failing"; exit 1; }
          [ "$total" -ge "${MIN_TESTS}" ] \
            || { echo "::error::test count $total is below the floor of ${MIN_TESTS}"; exit 1; }

      - name: Bundle lint (wellness flavour)
        run: npm run lint:bundle

      # The entertainment flavour is what carries the "does not exhibit health
      # features" declaration, so it is linted too — the declaration is only as
      # good as the artefact it describes.
      - name: Build and lint the entertainment flavour
        shell: bash
        run: |
          node -e "const f='src/flags.js',fs=require('fs');const o=fs.readFileSync(f,'utf8');fs.writeFileSync(f+'.bak',o);fs.writeFileSync(f,o.replace('MODULE_B_SAFETY_REFERRALS = true','MODULE_B_SAFETY_REFERRALS = false'))"
          npm run build
          grep -q '"flavour": "entertainment-only"' dist/build-info.json \
            || { echo "::error::flag flip did not produce an entertainment build"; exit 1; }
          npm run lint:bundle
          node -e "const f='src/flags.js',fs=require('fs');fs.writeFileSync(f,fs.readFileSync(f+'.bak','utf8'));fs.unlinkSync(f+'.bak')"

  smoke:
    # The positive control. If the app does not serve at all, every other job
    # is measuring nothing — that is exactly the defect this repo shipped when
    # a traversal guard "passed" while returning 403 to every request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      # PORT is pinned because serve.js defaults to 5173. The supplied workflow
      # once curled 8123 while the server bound 5173, so the smoke test could
      # only ever fail.
      - name: Serve and assert the app actually responds
        shell: bash
        env:
          PORT: '8123'
        run: |
          npm start &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1 && break
            sleep 0.25
          done

          echo "--- / ---"
          code="$(curl -s -o /tmp/root.html -w '%{http_code}' "http://127.0.0.1:${PORT}/")"
          [ "$code" = "200" ] || { echo "::error::/ returned $code"; exit 1; }
          grep -q "<title>Mien Shiang</title>" /tmp/root.html \
            || { echo "::error::/ responded but did not serve the app"; exit 1; }

          echo "--- /manifest.webmanifest ---"
          curl -fsS "http://127.0.0.1:${PORT}/manifest.webmanifest" -o /tmp/m.json \
            || { echo "::error::manifest did not serve"; exit 1; }
          node -e "
            const m=require('/tmp/m.json');
            for (const k of ['start_url','icons','name','display']) {
              if (!(k in m)) { console.error('::error::manifest missing '+k); process.exit(1); }
            }
            if (!Array.isArray(m.icons) || m.icons.length === 0) {
              console.error('::error::manifest has no icons'); process.exit(1);
            }
            console.log('manifest ok:', m.name, m.icons.length + ' icons');
          "

          echo "--- /.well-known/assetlinks.json ---"
          code="$(curl -s -o /tmp/al.json -w '%{http_code}' "http://127.0.0.1:${PORT}/.well-known/assetlinks.json")"
          [ "$code" = "200" ] || { echo "::error::assetlinks.json returned $code"; exit 1; }
          node -e "
            const a=require('/tmp/al.json');
            if (!Array.isArray(a)) { console.error('::error::assetlinks.json must be a JSON array'); process.exit(1); }
            console.log('assetlinks.json is valid JSON,', a.length, 'statement(s)');
          "

          echo "--- /privacy.html and /terms.html ---"
          for page in privacy.html terms.html; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/$page")"
            [ "$code" = "200" ] || { echo "::error::/$page returned $code"; exit 1; }
          done

          # NEGATIVE CONTROL, paired with the positives above. A server that
          # returns 200 to everything would pass every check so far.
          echo "--- negative control ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/definitely-not-here.txt")"
          [ "$code" = "404" ] || { echo "::error::expected 404 for a missing file, got $code"; exit 1; }
          echo "all smoke checks passed"
