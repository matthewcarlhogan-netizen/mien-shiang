<!--
  Mien Shiang social preview, authored in-repo.
  This is a static brand field, not a user's reading: it carries no face,
  measurement, personal seal, or inferred result.
  Palette values are taken from src/ui/qise/palette.js. No external assets or
  fonts are used, so the raster preview remains reproducible and offline-safe.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mien Shiang — a private, on-device face scanner</title>
  <desc id="desc">A quiet editorial cover on mineral paper with a restrained red field and line mark.</desc>

  <!-- A flat print-like cover: paper, type, one red field, and fine rules. -->
  <rect width="1200" height="630" fill="#DCDBD3"/>
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#1B1917" stroke-opacity=".32"/>
  <path d="M48 154H1152M48 500H1152" stroke="#1B1917" stroke-opacity=".2"/>

  <g fill="#1B1917" font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="116" fill="#B0392A" font-size="18" font-weight="700" letter-spacing="5">MIEN SHIANG</text>
    <text x="1042" y="116" font-size="13" font-weight="700" letter-spacing="2.2" text-anchor="end">PRIVATE / ON DEVICE</text>
  </g>

  <g fill="#1B1917" font-family="Georgia, 'Times New Roman', serif">
    <text x="92" y="270" font-size="74" letter-spacing="-2">A private</text>
    <text x="92" y="352" font-size="74" letter-spacing="-2">reading room.</text>
  </g>

  <g fill="#1B1917" font-family="Arial, Helvetica, sans-serif">
    <text x="94" y="414" font-size="21" letter-spacing=".2">An on-device face scanner rooted in tradition.</text>
    <text x="94" y="542" font-size="14" font-weight="700" letter-spacing="2.5">ENTERTAINMENT · NOT A MEDICAL DEVICE</text>
  </g>

  <!-- A neutral brand mark, not a result: no axes, grid, data, or face. -->
  <g transform="translate(836 190)">
    <rect x="0" y="0" width="262" height="262" fill="#B0392A"/>
    <rect x="17" y="17" width="228" height="228" fill="none" stroke="#EDE8DC" stroke-width="3"/>
    <path d="M69 181C43 163 37 124 51 91C66 56 104 36 141 45C169 52 193 71 201 99"
      fill="none" stroke="#EDE8DC" stroke-width="11" stroke-linecap="butt"/>
    <circle cx="184" cy="74" r="15" fill="#EDE8DC"/>
    <path d="M58 207H204" stroke="#4A6E67" stroke-width="3"/>
    <path d="M58 218H160" stroke="#C09A2B" stroke-width="3"/>
    <path d="M58 229H116" stroke="#1B1917" stroke-width="3"/>
  </g>
</svg>
